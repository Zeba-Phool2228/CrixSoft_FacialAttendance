<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Attendance{% endblock %} · FaceTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="kiosk-page">
    <div class="kiosk-header">
      <div class="brand-wrapper" style="margin-bottom: 8px; padding-left: 0; justify-content: center;">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1311" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3H5a2 2 0 0 0-2 2v4m0 6v4a2 2 0 0 0 2 2h4m6 0h4a2 2 0 0 0 2-2v-4m0-6V5a2 2 0 0 0-2-2h-4"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div class="brand">FaceTrack</div>
      </div>
      <div class="brand-sub">Employee Attendance Portal</div>
    </div>
    <div class="kiosk-content">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
